<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Plan de Pago</title>
<style>
:root{--bg:#0b3a53;--card:#ffffff;--ink:#14283a;--muted:#5b6f7f;--line:#d4dfe5;--sea:#2baeb1;--warn:#b4441d}
@media (prefers-color-scheme:dark){:root{--card:#142029;--ink:#e2ebf0;--muted:#93a6b3;--line:#283a46;--warn:#f08a62;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
form{background:var(--card);color:var(--ink);width:100%;max-width:360px;border-radius:16px;padding:26px 22px;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
h1{margin:0;font-size:1.35rem}
p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.4}
label{display:grid;gap:5px;font-size:.85rem;font-weight:600}
input[type=password],input[type=text]{font:inherit;font-size:16px;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);width:100%}
input:focus,button:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}
button{font:inherit;font-weight:700;font-size:1rem;border:none;border-radius:10px;padding:13px;background:var(--bg);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{background:var(--sea);color:#06222e}}
button:disabled{opacity:.6}
.err{color:var(--warn);font-weight:600;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="on" hidden>
  <h1>Plan de pago</h1>
  <p>Acceso privado. Escriba la contraseña para continuar.</p>
  <input type="text" name="username" value="plan-de-pago" autocomplete="username" hidden>
  <label>Contraseña<input id="pw" type="password" autocomplete="current-password" required></label>
  <label class="chk"><input id="rem" type="checkbox" checked> Recordar en este teléfono</label>
  <button id="go" type="submit">Entrar</button>
  <p class="err" id="err" role="alert"></p>
</form>

const KEY="plan_pago_key";
const u8=b=>Uint8Array.from(atob(b),ch=>ch.charCodeAt(0));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function abrir(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},key,u8(P.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function derivar(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
  let saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){
    try{const k=await crypto.subtle.importKey("raw",u8(saved),"AES-GCM",false,["decrypt"]);await abrir(k);return;}
    catch(e){try{localStorage.removeItem(KEY);}catch(_){}}
  }
  const f=document.getElementById("f");f.hidden=false;document.getElementById("pw").focus();
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=document.getElementById("go"),err=document.getElementById("err");
    btn.disabled=true;btn.textContent="Verificando…";err.textContent="";
    try{
      const k=await derivar(document.getElementById("pw").value.trim());
      const raw=await crypto.subtle.exportKey("raw",k);
      const k2=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
      await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},k2,u8(P.ct));
      if(document.getElementById("rem").checked){try{localStorage.setItem(KEY,b64(raw));}catch(_){}}
      await abrir(k2);
    }catch(x){
      err.textContent="Contraseña incorrecta.";btn.disabled=false;btn.textContent="Entrar";
    }
  });
})();
</script>
